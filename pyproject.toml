[build-system]
requires = ["uv_build<0.12"]
build-backend = "uv_build"

[project]
name = "mri-utilities"
description = "Miscellaneous utilities to work with MRI data"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Raj Magesh Gauthaman", email = "mri-utilities@raj-magesh.org" },
]
keywords = ["MRI"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
urls = { repository = "https://codeberg.org/raj-magesh/mri-utilities" }
dependencies = [
    "loguru",
    # "dcm2niix", # FIXME when cmake on cluster gets better
    "heudiconv[all]",
]
import-names = ["mri_utilities"]
version = "0.1.0"

[project.scripts]
run_smriprep = "mri_utilities.smriprep:run_smriprep"
run_mri_deface = "mri_utilities.mri_deface:run_mri_deface"

[dependency-groups]
dev = ["ruff", "ty", "pytest", "sphinx"]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
